name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    name: Validate project and test code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies on runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate catalog JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import PurePosixPath
          from jsonschema import validate

          with open("data/index.json", encoding="utf-8") as f:
              catalog = json.load(f)

          with open("docs/catalog-schema.json", encoding="utf-8") as f:
              schema = json.load(f)

          validate(instance=catalog, schema=schema)

          assert catalog["supported_years"] == [2023, 2024, 2025]
          assert len(catalog["supported_assets"]) == 6

          datasets = catalog["datasets"]
          assert isinstance(datasets, list)

          seen = set()

          for dataset in datasets:
              asset = dataset["asset"]
              year = dataset["year"]
              key = (asset, year)

              assert asset in catalog["supported_assets"], (
                  f"Unsupported asset: {asset}"
              )
              assert year in catalog["supported_years"], (
                  f"Unsupported year: {year}"
              )
              assert key not in seen, (
                  f"Duplicate dataset entry: {asset} {year}"
              )

              seen.add(key)

              expected_path = f"data/{asset}/{year}/1min.parquet"
              assert dataset["path"] == expected_path, (
                  f"Unexpected dataset path: {dataset['path']}"
              )

              assert dataset["rows"] > 0
              assert dataset["size_bytes"] > 0
              assert len(dataset["sha256"]) == 64

              path = PurePosixPath(dataset["path"])
              assert not path.is_absolute()
              assert ".." not in path.parts

          print(
              f"Catalog validation passed: "
              f"{len(datasets)} dataset(s), "
              f"{len(seen)} unique asset/year combinations."
          )
          PY

      - name: Check Python source syntax
        run: python -m compileall -q src tools tests

      - name: Run test suite
        run: python -m pytest -v
