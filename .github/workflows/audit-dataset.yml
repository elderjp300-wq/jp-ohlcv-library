name: Audit Published Dataset

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Dataset asset
        required: true
        type: choice
        options:
          - EURUSD
          - GBPUSD
          - USDJPY
          - XAUUSD
          - US30
          - US100
      year:
        description: Dataset year
        required: true
        type: choice
        options:
          - "2023"
          - "2024"
          - "2025"

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ inputs.asset }} ${{ inputs.year }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate published Parquet dataset
        run: |
          mkdir -p audit-report

          python tools/validate_dataset.py \
            "data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet" \
            --year "${{ inputs.year }}" \
            | tee audit-report/report.json

      - name: Compare validation results with catalog
        run: |
          python - <<'PY'
          import json
          import os

          asset = os.environ["ASSET"]
          year = int(os.environ["YEAR"])

          with open("audit-report/report.json", encoding="utf-8") as f:
              report = json.load(f)

          with open("data/index.json", encoding="utf-8") as f:
              catalog = json.load(f)

          matches = [
              item for item in catalog["datasets"]
              if item["asset"] == asset and item["year"] == year
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one catalog entry for {asset} {year}; "
                  f"found {len(matches)}"
              )

          entry = matches[0]

          fields = (
              "rows",
              "size_bytes",
              "sha256",
              "first_timestamp",
              "last_timestamp",
          )

          differences = []

          for field in fields:
              if report[field] != entry[field]:
                  differences.append(
                      f"{field}: report={report[field]!r}, "
                      f"catalog={entry[field]!r}"
                  )

          if differences:
              raise SystemExit(
                  "Dataset and catalog metadata do not match:\n"
                  + "\n".join(differences)
              )

          print(f"Catalog comparison passed for {asset} {year}.")
          print(f"Rows: {report['rows']}")
          print(f"Gap intervals: {report['gap_intervals']}")
          print(f"Missing minutes: {report['missing_minutes']}")
          print(f"Largest gap: {report['largest_gap_minutes']} minutes")
          PY
        env:
          ASSET: ${{ inputs.asset }}
          YEAR: ${{ inputs.year }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ inputs.asset }}-${{ inputs.year }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30
