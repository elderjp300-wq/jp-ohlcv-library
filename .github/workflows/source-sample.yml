name: Dukascopy Source Sample Inspection

on:
  workflow_dispatch:
    inputs:
      sample_date:
        description: "Historical sample date (2023-2025 only)"
        required: true
        default: "2025-01-06"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Dukascopy tick samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inspection dependency
        run: python -m pip install "requests>=2.32"

      - name: Inspect all six instruments
        run: |
          python scripts/inspect_dukascopy_samples.py \
            --date "${{ inputs.sample_date }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
