name: Dukascopy Source Sample Inspection

on:
  push:
    branches:
      - develop
    paths:
      - "scripts/inspect_dukascopy_samples.py"
      - ".github/workflows/source-sample.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Dukascopy tick samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inspection dependency
        run: python -m pip install "requests>=2.32"

      - name: Inspect all six instruments
        run: |
          python scripts/inspect_dukascopy_samples.py \
            --date 2025-01-06 \
            | tee -a "$GITHUB_STEP_SUMMARY"
