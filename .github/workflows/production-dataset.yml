name: Production Annual Dataset

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Asset to download
        required: true
        type: choice
        options:
          - EURUSD
          - GBPUSD
          - USDJPY
          - XAUUSD
          - US30
          - US100
        default: EURUSD

      year:
        description: Dataset year
        required: true
        type: choice
        options:
          - "2023"
          - "2024"
          - "2025"
        default: "2023"

permissions:
  contents: write

concurrency:
  group: production-${{ inputs.asset }}-${{ inputs.year }}
  cancel-in-progress: false

jobs:
  produce:
    name: Produce ${{ inputs.asset }} ${{ inputs.year }}
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pinned downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "dukascopy-downloader==1.1.0"

      - name: Restore Dukascopy cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/duka-cache
          key: duka-v1-${{ inputs.asset }}-${{ inputs.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            duka-v1-${{ inputs.asset }}-${{ inputs.year }}-

      - name: Download, normalize and validate annual dataset
        id: produce
        run: |
          python scripts/download_annual_dataset.py \
            --asset "${{ inputs.asset }}" \
            --year "${{ inputs.year }}" \
            --cache-dir "$RUNNER_TEMP/duka-cache" \
            --report "$RUNNER_TEMP/production-report/report.json" \
            --repository .

      - name: Save Dukascopy cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/duka-cache
          key: duka-v1-${{ inputs.asset }}-${{ inputs.year }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload production report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ inputs.asset }}-${{ inputs.year }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/production-report/
            ${{ runner.temp }}/duka-cache/_logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate catalog schema
        if: success()
        run: |
          python -m pip install "jsonschema>=4.23"
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          with open("docs/catalog-schema.json", encoding="utf-8") as f:
              schema = json.load(f)

          with open("data/index.json", encoding="utf-8") as f:
              catalog = json.load(f)

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(catalog)

          print("Catalog schema validation passed.")
          PY

      - name: Commit verified dataset to develop
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet" \
            data/index.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Add ${{ inputs.asset }} M1 dataset for ${{ inputs.year }}"
          git push origin HEAD:develop
