name: Dukascopy Downloader Compatibility

on:
  push:
    branches:
      - develop
    paths:
      - "scripts/test_dukascopy_downloader.py"
      - ".github/workflows/downloader-compatibility.yml"

permissions:
  contents: read

jobs:
  compatibility:
    name: Test six Dukascopy instruments
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pinned downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "dukascopy-downloader==1.1.0"

      - name: Run six-instrument compatibility test
        run: |
          python scripts/test_dukascopy_downloader.py \
            --date 2025-01-06 \
            --output-dir "$RUNNER_TEMP/dukascopy-compatibility" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report, logs and sample Parquet files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-compatibility-${{ github.run_number }}
          path: ${{ runner.temp }}/dukascopy-compatibility/
          if-no-files-found: warn
          retention-days: 14
