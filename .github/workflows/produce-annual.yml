name: Produce Annual Dataset

on:
  workflow_dispatch:
    inputs:
      asset:
        type: choice
        options: [EURUSD, GBPUSD, USDJPY, XAUUSD, US30, US100]
        required: true
      year:
        type: choice
        options: ["2023", "2024", "2025"]
        required: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dukascopy-downloader
        run: pip install dukascopy-downloader==1.1.0

      - name: Download M1 candles
        run: |
          duka download ${{ inputs.asset }} \
            --tf m1 \
            --from ${{ inputs.year }}-01-01 \
            --to ${{ inputs.year }}-12-31 \
            --side BID \
            --data-dir cache \
            --rate 2

      - name: Export to Parquet
        run: |
          mkdir -p data/${{ inputs.asset }}/${{ inputs.year }}
          duka export ${{ inputs.asset }} \
            --from ${{ inputs.year }}-01-01 \
            --to ${{ inputs.year }}-12-31 \
            --side BID \
            --data-dir cache \
            -o data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet

      - name: Normalize schema and validate completeness
        run: |
          python - <<'PY'
          import pandas as pd, pathlib, sys

          asset = "${{ inputs.asset }}"
          year  = int("${{ inputs.year }}")
          path  = pathlib.Path(f"data/{asset}/{year}/1min.parquet")
          df    = pd.read_parquet(path)

          # --- if time is the index, bring it back as a column --------------
          if isinstance(df.index, pd.DatetimeIndex):
              df = df.reset_index()

          df.columns = [str(c).strip().lower() for c in df.columns]
          aliases = {"time":"timestamp","datetime":"timestamp","date":"timestamp","vol":"volume"}
          df = df.rename(columns={k:v for k,v in aliases.items() if k in df.columns and v not in df.columns})

          required = ["timestamp","open","high","low","close","volume"]
          missing  = [c for c in required if c not in df.columns]
          if missing:
              sys.exit(f"EXPORT MISSING COLUMNS: {missing}. Found: {list(df.columns)}")

          df = df[required].copy()
          df["timestamp"] = pd.to_datetime(df["timestamp"], utc=True, errors="raise")
          for c in ["open","high","low","close","volume"]:
              df[c] = pd.to_numeric(df[c], errors="coerce")
          if df.isnull().any().any():
              sys.exit("NULL VALUES after numeric coercion")

          # --- integrity checks (numpy-based, no pandas ambiguous truth) ----
          ts = df["timestamp"].to_numpy()
          if pd.Series(ts).duplicated().any():
              sys.exit("DUPLICATE timestamps")
          if not pd.Series(ts).is_monotonic_increasing:
              sys.exit("TIMESTAMPS not increasing")

          o = df["open"].to_numpy();  h = df["high"].to_numpy()
          l = df["low"].to_numpy();   c = df["close"].to_numpy()
          if not (o > 0).all() or not (h > 0).all() or not (l > 0).all() or not (c > 0).all():
              sys.exit("NON-POSITIVE price")
          if not (h >= l).all():
              sys.exit("HIGH < LOW")
          if not (h >= o).all() or not (h >= c).all():
              sys.exit("HIGH < OPEN/CLOSE")
          if not (l <= o).all() or not (l <= c).all():
              sys.exit("LOW > OPEN/CLOSE")

          # --- completeness gate (relaxed) ---------------------------------
          total = len(df)
          expected = 525_600  # 365*1440
          coverage = total / expected
          print(f"Rows: {total:,} | coverage vs 525,600 = {coverage:.2%}")
          if coverage < 0.95:
              sys.exit(f"INCOMPLETE: {asset} {year} has {total:,} rows, coverage {coverage:.2%} < 95%")

          # --- rewrite with exact schema -----------------------------------
          df.to_parquet(path, index=False, compression="snappy")
          print(f"VALIDATED {asset} {year}: {len(df):,} rows")
          PY

      - name: Commit dataset and catalog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet"

          python - <<'PY'
          import json, pathlib
          asset = "${{ inputs.asset }}"
          year  = int("${{ inputs.year }}")
          idx   = pathlib.Path("data/index.json")
          cat   = json.loads(idx.read_text())
          cat["datasets"] = [d for d in cat["datasets"] if not (d["asset"] == asset and d["year"] == year)]
          cat["datasets"].append({
              "asset": asset, "year": year,
              "timeframe": "1m", "format": "parquet",
              "path": f"data/{asset}/{year}/1min.parquet",
              "price_basis": "Dukascopy BID candles",
              "volume_type": "provider-reported candle volume"
          })
          cat["datasets"].sort(key=lambda x: (x["asset"], x["year"]))
          idx.write_text(json.dumps(cat, indent=2) + "\n")
          PY

          git add data/index.json
          git diff --cached --quiet || git commit -m "Add ${asset} ${year} M1 dataset (native duka M1)"
          git push origin develop
