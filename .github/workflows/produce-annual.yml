name: Produce Annual Dataset

on:
  workflow_dispatch:
    inputs:
      asset:
        type: choice
        options: [EURUSD, GBPUSD, USDJPY, XAUUSD, US30, US100]
        required: true
      year:
        type: choice
        options: ["2023", "2024", "2025"]
        required: true

permissions:
  contents: write

concurrency:
  group: produce-${{ inputs.asset }}-${{ inputs.year }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install dukascopy-downloader==1.1.0 pandas pyarrow

      - name: Download M1 candles
        run: |
          duka download ${{ inputs.asset }} \
            --tf m1 --from ${{ inputs.year }}-01-01 --to ${{ inputs.year }}-12-31 \
            --side BID --data-dir cache --rate 2

      - name: Export to Parquet
        run: |
          mkdir -p "data/${{ inputs.asset }}/${{ inputs.year }}"
          duka export ${{ inputs.asset }} \
            --from ${{ inputs.year }}-01-01 --to ${{ inputs.year }}-12-31 \
            --side BID --data-dir cache \
            -o "data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet"

      - name: Validate and normalize
        run: |
          python scripts/produce.py \
            --path "data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet" \
            --asset "${{ inputs.asset }}" \
            --year ${{ inputs.year }}

      - name: Commit dataset and catalog (race-safe)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PARQUET="data/${{ inputs.asset }}/${{ inputs.year }}/1min.parquet"

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "---- attempt $attempt ----"
            git fetch origin develop
            git reset --soft origin/develop
            git add "$PARQUET"
            # regenerate index.json on top of the freshly-pulled version
            python scripts/produce.py \
              --path "$PARQUET" \
              --asset "${{ inputs.asset }}" \
              --year ${{ inputs.year }} \
              --skip-rewrite >/dev/null
            git add data/index.json
            if git diff --cached --quiet; then
              echo "No staged changes, exiting clean."
              exit 0
            fi
            git commit -m "Add ${{ inputs.asset }} ${{ inputs.year }} M1 dataset"
            if git push origin HEAD:develop; then
              echo "✅ pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "❌ push failed after 8 attempts" >&2
          exit 1
